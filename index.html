<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cumpleaños de Emma</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #fce4ec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* PANTALLA PREVIA (WELCOME SCREEN) */
    #welcome-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(180deg, #e1f5fe 0%, #fce4ec 50%, #f3e5f5 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 25px;
      text-align: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .rainbow-bg {
      position: absolute;
      width: 280px;
      height: 140px;
      border-radius: 140px 140px 0 0;
      background: conic-gradient(from 180deg at 50% 100%, #ff80ab, #ffd54f, #81c784, #64b5f6, #ba68c8);
      opacity: 0.25;
      top: 18%;
      filter: blur(10px);
    }

    .welcome-card {
      position: relative;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 3px solid #ffffff;
      border-radius: 28px;
      padding: 35px 25px;
      box-shadow: 0 15px 35px rgba(244, 143, 177, 0.3);
      max-width: 360px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .icon-header {
      font-size: 42px;
      line-height: 1;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .welcome-title {
      color: #8e24aa;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: 0.2px;
      text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.8);
    }

    .btn-entrar {
      background: linear-gradient(135deg, #ff80ab 0%, #ec407a 100%);
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      border: none;
      padding: 14px 40px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(236, 64, 122, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-entrar:active {
      transform: scale(0.95);
      box-shadow: 0 3px 10px rgba(236, 64, 122, 0.3);
    }

    /* CONTENEDOR PRINCIPAL */
    .card-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      border-radius: 20px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 1s ease 0.3s;
    }

    .card-container.visible {
      opacity: 1;
    }

    .invitacion-img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* CAPA DE DESTELLOS DE BRILLO (SPARKLES) */
    .sparkle-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .sparkle {
      position: absolute;
      width: 18px;
      height: 18px;
      background: radial-gradient(circle, #ffffff 10%, rgba(255, 255, 255, 0.8) 30%, transparent 70%);
      clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9));
      opacity: 0;
      animation: twinkle 2.5s infinite ease-in-out;
    }

    .s1 { top: 21%; left: 21%; animation-delay: 0s; transform: scale(1.1); }
    .s2 { top: 29%; left: 32%; animation-delay: 0.6s; transform: scale(0.8); }
    .s3 { top: 31%; left: 45%; animation-delay: 1.2s; transform: scale(1.2); }
    .s4 { top: 30%; left: 63%; animation-delay: 0.3s; transform: scale(0.9); }
    .s5 { top: 32%; left: 77%; animation-delay: 1.8s; transform: scale(1); }
    .s6 { top: 25%; left: 28%; animation-delay: 2.1s; transform: scale(0.7); }

    @keyframes twinkle {
      0% { opacity: 0; transform: scale(0.2) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.3) rotate(90deg); filter: drop-shadow(0 0 8px #ffffff); }
      100% { opacity: 0; transform: scale(0.2) rotate(180deg); }
    }

    /* ZONAS INTERACTIVAS TRANSPARENTES (SIN GLOW NI BORDES) */
    .hotspot {
      position: absolute;
      display: block;
      cursor: pointer;
      text-decoration: none;
      border-radius: 20px;
      z-index: 10;
      transition: transform 0.2s ease;
    }

    .hotspot:active {
      transform: scale(0.97);
    }

    .hotspot-ubicacion {
      top: 60.2%;
      left: 29%;
      width: 42%;
      height: 5.6%;
    }

    .hotspot-confirmar {
      top: 76%;
      left: 29%;
      width: 42%;
      height: 5.6%;
    }

    /* AROS CONCÉNTRICOS ANIMADOS EN LOS ICONOS */
    .icon-pulse {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 8;
    }

    .pulse-ubicacion {
      top: 60.5%;
      left: 30.5%;
      width: 32px;
      height: 32px;
      border: 2px solid #8e24aa;
      animation: ring-expand 2s infinite;
    }

    .pulse-confirmar {
      top: 76.3%;
      left: 30.5%;
      width: 32px;
      height: 32px;
      border: 2px solid #26a69a;
      animation: ring-expand 2s infinite 1s;
    }

    @keyframes ring-expand {
      0% {
        transform: scale(0.85);
        opacity: 0.85;
      }
      100% {
        transform: scale(1.55);
        opacity: 0;
      }
    }

    .fade-out {
      opacity: 0 !important;
      visibility: hidden !important;
    }
  </style>
</head>
<body>

  <!-- PANTALLA PREVIA DE BIENVENIDA -->
  <div id="welcome-screen">
    <div class="rainbow-bg"></div>
    <div class="welcome-card">
      <div class="icon-header">🦄🌈</div>
      <p class="welcome-title">Estás invitado a galopar al final del arcoíris</p>
      <button class="btn-entrar" id="btnEntrar">Entrar</button>
    </div>
  </div>

  <!-- TARJETA PRINCIPAL -->
  <div class="card-container" id="mainCard">
    <img src="invitacion.jpeg" alt="Invitación Cumpleaños Emma" class="invitacion-img">

    <!-- Capa de Destellos sobre la Pedrería -->
    <div class="sparkle-layer">
      <div class="sparkle s1"></div>
      <div class="sparkle s2"></div>
      <div class="sparkle s3"></div>
      <div class="sparkle s4"></div>
      <div class="sparkle s5"></div>
      <div class="sparkle s6"></div>
    </div>

    <!-- Únicamente los aros concéntricos sobre los iconos -->
    <div class="icon-pulse pulse-ubicacion"></div>
    <div class="icon-pulse pulse-confirmar"></div>

    <!-- Enlaces interactivos transparentes -->
    <a href="https://maps.google.com/?q=Casa+Club+Real+Madeira" target="_blank" rel="noopener noreferrer" class="hotspot hotspot-ubicacion" title="Ver ubicación en Google Maps"></a>
    <a href="https://wa.me/527711246170?text=%C2%A1Hola!%20Confirmo%20mi%20asistencia%20al%20cumplea%C3%B1os%20de%20Emma." target="_blank" rel="noopener noreferrer" class="hotspot hotspot-confirmar" title="Confirmar asistencia por WhatsApp"></a>
  </div>

  <!-- AUDIO DE FONDO -->
  <audio id="bgMusic" loop preload="auto">
    <source src="golden.mp3" type="audio/mpeg">
    Tu navegador no soporta el elemento de audio.
  </audio>

  <script>
    const btnEntrar = document.getElementById('btnEntrar');
    const welcomeScreen = document.getElementById('welcome-screen');
    const mainCard = document.getElementById('mainCard');
    const bgMusic = document.getElementById('bgMusic');

    btnEntrar.addEventListener('click', () => {
      bgMusic.play().catch(error => {
        console.log("Error al reproducir audio:", error);
      });

      welcomeScreen.classList.add('fade-out');
      mainCard.classList.add('visible');
      document.body.style.overflow = 'auto';
    });
  </script>

</body>
</html>
